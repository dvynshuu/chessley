<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c1017"/>
      <stop offset="100%" stop-color="#04060a"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ecd599"/>
      <stop offset="50%" stop-color="#c8aa6e"/>
      <stop offset="100%" stop-color="#9a7a40"/>
    </linearGradient>
    <linearGradient id="platGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <radialGradient id="aura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c8aa6e" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#c8aa6e" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Rounded App Tile Background -->
  <rect width="100" height="100" rx="22" fill="url(#bgGrad)"/>
  <circle cx="50" cy="50" r="42" fill="url(#aura)"/>
  <rect width="98" height="98" x="1" y="1" rx="21" fill="none" stroke="rgba(200, 170, 110, 0.2)" stroke-width="1"/>

  <!-- Chessley Dual-Tone Knight Symbol -->
  <g filter="url(#shadow)" transform="translate(18, 12) scale(0.64)">
    <!-- Base Plate -->
    <!-- Gold Left Base -->
    <path d="M 12 96 L 50 96 L 50 88 L 14 88 C 12 88 10 90 12 96 Z" fill="url(#goldGrad)" />
    <!-- Platinum Right Base -->
    <path d="M 50 96 L 88 96 C 90 90 88 88 86 88 L 50 88 Z" fill="url(#platGrad)" />

    <!-- Pedestal Middle -->
    <!-- Gold Left -->
    <path d="M 17 84 L 50 84 L 50 68 C 38 68 28 72 20 81 C 18 83 17 84 17 84 Z" fill="url(#goldGrad)" />
    <!-- Platinum Right -->
    <path d="M 50 84 L 83 84 C 83 84 82 83 80 81 C 72 72 62 68 50 68 Z" fill="url(#platGrad)" />

    <!-- Neck & Mane (Gold Left Contour) -->
    <path d="M 50 66 C 36 66 22 55 18 36 C 16 28 20 18 32 10 C 35 8 38 6 42 5 C 40 10 39 16 41 22 C 34 26 31 35 32 45 C 33 55 41 62 50 66 Z" fill="url(#goldGrad)" />
    <path d="M 42 5 C 36 10 30 18 28 28 C 26 40 30 52 38 60 C 35 55 33 46 34 38 C 35 30 38 22 44 14 C 47 10 50 7 53 5 C 49 4 45 4 42 5 Z" fill="#edd69b" />

    <!-- Head & Muzzle (Platinum Right Face) -->
    <path d="M 50 18 C 50 18 52 14 55 12 C 58 14 62 20 64 24 C 69 25 76 28 81 33 C 84 36 82 40 78 41 C 75 42 70 41 68 40 C 66 43 62 44 60 44 C 57 44 55 42 53 41 C 58 49 61 58 50 66 Z" fill="url(#platGrad)" />
    <!-- Muzzle Highlight & Eye -->
    <path d="M 54 28 C 56 26 58 26 60 28 C 60 30 58 31 56 31 C 54 31 53 30 54 28 Z" fill="#0c1017" />
    <path d="M 72 35 C 75 36 78 37 76 39 C 74 40 72 38 72 35 Z" fill="#64748b" />

    <!-- Ear -->
    <path d="M 51 17 L 54 8 C 55 7 57 8 57 10 L 56 18 Z" fill="url(#goldGrad)" />
    <path d="M 56 18 L 57 10 C 58 12 60 14 61 17 Z" fill="url(#platGrad)" />
  </g>
</svg>
